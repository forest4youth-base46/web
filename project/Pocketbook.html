document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  /* ─── PALETTE: refined, low-chroma forest ─── */\n  :root {\n    --forest-ink:    #14302A;   /* deepest — headings, primary text */\n    --forest-deep:   #234A3E;   /* primary brand green */\n    --forest-mid:    #3A6B5A;   /* secondary */\n    --forest-soft:   #7FA396;   /* tertiary, accents */\n    --forest-mist:   #C8D8D0;   /* hairline, dividers */\n\n    --paper:         #F4F1EA;   /* warm cream page bg */\n    --paper-card:    #FBF9F4;   /* card bg */\n    --paper-pure:    #FFFFFF;\n\n    --bark:          #6B5240;   /* warm earth */\n    --ember:         #B8552E;   /* single accent (timer, ember) */\n\n    --ink:           #1B2A24;\n    --ink-soft:      #4D6359;\n    --ink-faint:     #7C8E85;\n\n    --r-sm: 6px;\n    --r-md: 10px;\n    --r-lg: 14px;\n    --r-pill: 999px;\n\n    --shadow-sm: 0 1px 2px rgba(20,48,42,0.04);\n    --shadow-md: 0 4px 16px rgba(20,48,42,0.06);\n    --shadow-lg: 0 12px 32px rgba(20,48,42,0.10);\n  }\n\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  html, body { background: var(--paper); transition: background 0.4s ease; }\n\n  /* ─── MODE: PRACTITIONER (denser, cooler paper, clinical) ─── */\n  body[data-mode=\"practitioner\"] {\n    --paper:      #FAFAF7;\n    --paper-card: #FFFFFF;\n    --forest-mist: #D6DDD8;\n    --ink-soft:   #3C4F47;\n  }\n  body[data-mode=\"practitioner\"] {\n    padding: 32px 20px 64px;\n    font-family: 'IBM Plex Sans', sans-serif;\n  }\n  body[data-mode=\"practitioner\"] .section-header h1 { font-size: 30px; }\n  body[data-mode=\"practitioner\"] .pocket-group { margin-bottom: 28px; }\n  body[data-mode=\"practitioner\"] .activity-trigger { padding: 11px 14px; }\n  body[data-mode=\"practitioner\"] .activity-name { font-size: 13.5px; }\n  body[data-mode=\"practitioner\"] .activity-detail { padding: 0 18px 18px 52px; }\n  body[data-mode=\"practitioner\"] .activity-list { gap: 4px; }\n  body[data-mode=\"practitioner\"] .prose { padding: 16px 20px; margin: 20px 0 32px; }\n\n  /* ─── MODE: HEARTH (deeper warm dusk) ─── */\n  body[data-mode=\"hearth\"] {\n    --paper:       #2A211A;\n    --paper-card:  #34291F;\n    --paper-pure:  #3D2F23;\n    --forest-ink:  #F4E8D0;\n    --forest-deep: #D9B97E;\n    --forest-mid:  #B89364;\n    --forest-soft: #8C7355;\n    --forest-mist: #4A3A2C;\n    --ink:         #EFE4CE;\n    --ink-soft:    #C4B49A;\n    --ink-faint:   #8C7E68;\n    --bark:        #C68E4A;\n    --ember:       #E07A3B;\n  }\n  body[data-mode=\"hearth\"]::before {\n    background:\n      radial-gradient(ellipse 700px 500px at 25% 15%, rgba(224,122,59,0.10), transparent 60%),\n      radial-gradient(ellipse 800px 600px at 80% 95%, rgba(217,185,126,0.06), transparent 60%);\n  }\n  body[data-mode=\"hearth\"] .visual-caption { background: var(--paper-card); }\n  body[data-mode=\"hearth\"] .activity-visual rect[fill=\"#F4F1EA\"],\n  body[data-mode=\"hearth\"] .activity-visual rect[fill=\"#FFFFFF\"] { fill: #34291F !important; }\n\n  /* ─── VOICE: POCKET (handwritten quotes & headings) ─── */\n  body[data-voice=\"pocket\"] .section-header h1,\n  body[data-voice=\"pocket\"] .pocket-group-title,\n  body[data-voice=\"pocket\"] .prose h3,\n  body[data-voice=\"pocket\"] .adaptations h2,\n  body[data-voice=\"pocket\"] .timer-activity-name {\n    font-family: 'Caveat', cursive !important;\n    font-weight: 600 !important;\n    letter-spacing: 0 !important;\n  }\n  body[data-voice=\"pocket\"] .section-header h1 { font-size: 52px; line-height: 1; }\n  body[data-voice=\"pocket\"] .pocket-group-title { font-size: 30px; }\n  body[data-voice=\"pocket\"] .prose h3 { font-size: 22px; }\n  body[data-voice=\"pocket\"] .adaptations h2 { font-size: 32px; }\n  body[data-voice=\"pocket\"] .detail-text--example {\n    font-family: 'Caveat', cursive;\n    font-style: normal;\n    font-size: 17px;\n    line-height: 1.4;\n    color: var(--forest-deep);\n  }\n  body[data-voice=\"pocket\"] .pocket-group-num {\n    font-family: 'Caveat', cursive;\n    font-size: 22px;\n    font-style: normal;\n  }\n  body[data-voice=\"pocket\"] .builder-title { font-family: 'Caveat', cursive; font-size: 26px; }\n\n  /* ─── VISUAL STYLE: PHOTOGRAPHIC (placeholder slot) ─── */\n  body[data-visuals=\"photo\"] .activity-visual svg { display: none; }\n  body[data-visuals=\"photo\"] .activity-visual {\n    position: relative;\n    height: 140px;\n    background:\n      linear-gradient(135deg, rgba(35,74,62,0.85), rgba(127,163,150,0.6)),\n      repeating-linear-gradient(45deg, rgba(0,0,0,0.04) 0 8px, transparent 8px 16px);\n  }\n  body[data-visuals=\"photo\"] .activity-visual::after {\n    content: 'photograph';\n    position: absolute;\n    inset: 0;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-family: 'IBM Plex Mono', ui-monospace, monospace;\n    font-size: 10px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: rgba(255,255,255,0.7);\n  }\n\n  /* ─── VISUAL STYLE: HIDDEN ─── */\n  body[data-visuals=\"hidden\"] .activity-visual { display: none; }\n  body[data-visuals=\"hidden\"] .activity-detail { padding-top: 12px; }\n\n  body {\n    font-family: 'Open Sans', -apple-system, sans-serif;\n    color: var(--ink);\n    font-weight: 300;\n    -webkit-font-smoothing: antialiased;\n    padding: 56px 24px 96px;\n    min-height: 100vh;\n  }\n\n  body::before {\n    content: '';\n    position: fixed;\n    inset: 0;\n    background:\n      radial-gradient(ellipse 800px 600px at 15% 10%, rgba(35,74,62,0.04), transparent 60%),\n      radial-gradient(ellipse 700px 500px at 85% 90%, rgba(127,163,150,0.05), transparent 60%);\n    pointer-events: none;\n    z-index: 0;\n  }\n\n  .layout {\n    max-width: 1280px;\n    margin: 0 auto;\n    display: grid;\n    grid-template-columns: minmax(0, 1fr) 320px;\n    gap: 40px;\n    position: relative;\n    z-index: 1;\n  }\n\n  .container { min-width: 0; }\n\n  /* ─── BREADCRUMB ─── */\n  .breadcrumb {\n    display: flex;\n    align-items: center;\n    gap: 8px;\n    font-size: 11px;\n    letter-spacing: 0.08em;\n    text-transform: uppercase;\n    color: var(--ink-faint);\n    margin-bottom: 28px;\n    font-weight: 500;\n  }\n  .breadcrumb a { color: var(--forest-mid); text-decoration: none; }\n  .breadcrumb a:hover { color: var(--forest-deep); }\n  .breadcrumb .sep { opacity: 0.4; }\n\n  /* ─── SECTION HEADER ─── */\n  .section-header { margin-bottom: 40px; }\n\n  .section-header .badge {\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n    font-size: 10px;\n    font-weight: 500;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: var(--forest-deep);\n    background: transparent;\n    border: 1px solid var(--forest-mist);\n    padding: 5px 12px 5px 10px;\n    border-radius: var(--r-pill);\n    margin-bottom: 18px;\n  }\n  .badge::before {\n    content: '';\n    width: 6px; height: 6px;\n    border-radius: 50%;\n    background: var(--forest-deep);\n  }\n\n  .section-header h1 {\n    font-family: 'Montserrat', sans-serif;\n    font-size: 38px;\n    font-weight: 500;\n    color: var(--forest-ink);\n    line-height: 1.1;\n    margin-bottom: 12px;\n    letter-spacing: -0.01em;\n  }\n\n  .section-sub {\n    font-size: 15px;\n    color: var(--ink-soft);\n    line-height: 1.65;\n    max-width: 620px;\n  }\n\n  /* ─── INTRO PROSE ─── */\n  .prose {\n    font-size: 14.5px;\n    line-height: 1.75;\n    color: var(--ink);\n    font-weight: 300;\n    margin: 32px 0 48px;\n    padding: 24px 28px;\n    background: var(--paper-card);\n    border: 1px solid var(--forest-mist);\n    border-radius: var(--r-md);\n    border-left: 3px solid var(--forest-soft);\n  }\n  .prose h3 {\n    font-family: 'Montserrat', sans-serif;\n    font-size: 16px;\n    font-weight: 600;\n    color: var(--forest-deep);\n    margin-bottom: 10px;\n    letter-spacing: -0.005em;\n  }\n  .prose p { margin-bottom: 10px; color: var(--ink-soft); }\n  .prose p:last-child { margin-bottom: 0; }\n  .prose strong { font-weight: 500; color: var(--forest-ink); }\n\n  /* ─── POCKET GROUPS ─── */\n  .pocket-group { margin-bottom: 44px; }\n\n  .pocket-group-header {\n    display: flex;\n    align-items: baseline;\n    justify-content: space-between;\n    margin-bottom: 18px;\n    padding-bottom: 12px;\n    border-bottom: 1px solid var(--forest-mist);\n  }\n\n  .pocket-group-headline { display: flex; align-items: baseline; gap: 14px; }\n\n  .pocket-group-num {\n    font-family: 'Montserrat', sans-serif;\n    font-style: italic;\n    font-size: 14px;\n    color: var(--forest-soft);\n    font-weight: 400;\n  }\n\n  .pocket-group-title {\n    font-family: 'Montserrat', sans-serif;\n    font-size: 22px;\n    font-weight: 500;\n    color: var(--forest-ink);\n    letter-spacing: -0.005em;\n  }\n\n  .pocket-group-meta {\n    font-size: 11px;\n    letter-spacing: 0.08em;\n    text-transform: uppercase;\n    color: var(--ink-faint);\n    font-weight: 500;\n  }\n\n  /* ─── ACTIVITY ITEMS ─── */\n  .activity-list { display: flex; flex-direction: column; gap: 8px; }\n\n  .activity-item {\n    background: var(--paper-pure);\n    border: 1px solid var(--forest-mist);\n    border-radius: var(--r-md);\n    overflow: hidden;\n    transition: border-color 0.2s ease, box-shadow 0.2s ease;\n  }\n  .activity-item:hover { border-color: var(--forest-soft); box-shadow: var(--shadow-sm); }\n  .activity-item.open { border-color: var(--forest-mid); box-shadow: var(--shadow-md); }\n\n  .activity-trigger {\n    display: flex;\n    align-items: center;\n    gap: 14px;\n    padding: 16px 18px;\n    cursor: pointer;\n    user-select: none;\n    background: transparent;\n  }\n\n  .activity-glyph {\n    width: 32px; height: 32px;\n    flex-shrink: 0;\n    color: var(--forest-mid);\n    display: flex; align-items: center; justify-content: center;\n  }\n  .activity-glyph svg { width: 100%; height: 100%; }\n\n  .activity-name {\n    font-size: 14.5px;\n    font-weight: 500;\n    color: var(--forest-ink);\n    flex: 1;\n    letter-spacing: -0.005em;\n  }\n\n  .activity-meta {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    flex-shrink: 0;\n  }\n\n  .activity-duration {\n    font-size: 11px;\n    color: var(--ink-soft);\n    font-variant-numeric: tabular-nums;\n    font-weight: 400;\n    letter-spacing: 0.02em;\n  }\n\n  .timer-icon {\n    width: 26px; height: 26px;\n    border-radius: 50%;\n    display: flex; align-items: center; justify-content: center;\n    background: var(--paper);\n    border: 1px solid var(--forest-mist);\n    color: var(--forest-mid);\n    cursor: pointer;\n    transition: all 0.18s;\n  }\n  .timer-icon:hover {\n    background: var(--ember);\n    border-color: var(--ember);\n    color: white;\n    transform: scale(1.06);\n  }\n  .timer-icon svg { width: 14px; height: 14px; }\n\n  .add-icon {\n    width: 26px; height: 26px;\n    border-radius: 50%;\n    display: flex; align-items: center; justify-content: center;\n    background: var(--paper);\n    border: 1px solid var(--forest-mist);\n    color: var(--forest-mid);\n    cursor: pointer;\n    transition: all 0.18s;\n    font-size: 18px;\n    line-height: 1;\n    font-weight: 400;\n  }\n  .add-icon:hover {\n    background: var(--forest-deep);\n    border-color: var(--forest-deep);\n    color: white;\n    transform: scale(1.06);\n  }\n  .add-icon.in-session {\n    background: var(--forest-deep);\n    border-color: var(--forest-deep);\n    color: white;\n  }\n\n  .chevron {\n    width: 14px; height: 14px;\n    color: var(--ink-faint);\n    transition: transform 0.25s ease;\n  }\n  .activity-item.open .chevron { transform: rotate(180deg); color: var(--forest-deep); }\n\n  /* ─── ACTIVITY DETAIL ─── */\n  .activity-detail {\n    display: none;\n    padding: 4px 22px 24px 64px;\n  }\n  .activity-item.open .activity-detail {\n    display: block;\n    animation: slideDown 0.28s ease;\n  }\n  @keyframes slideDown {\n    from { opacity: 0; transform: translateY(-4px); }\n    to { opacity: 1; transform: translateY(0); }\n  }\n\n  .activity-visual {\n    margin: 4px 0 18px;\n    border-radius: var(--r-sm);\n    overflow: hidden;\n    background: var(--paper);\n    border: 1px solid var(--forest-mist);\n  }\n  .activity-visual svg { display: block; width: 100%; height: auto; }\n\n  .visual-caption {\n    font-size: 11px;\n    color: var(--ink-faint);\n    text-align: center;\n    padding: 8px 14px;\n    font-style: italic;\n    border-top: 1px solid var(--forest-mist);\n    background: var(--paper-pure);\n    line-height: 1.5;\n  }\n\n  .detail-grid {\n    display: grid;\n    grid-template-columns: 110px 1fr;\n    gap: 12px 20px;\n    align-items: start;\n  }\n\n  .detail-label {\n    font-size: 10px;\n    font-weight: 500;\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    color: var(--forest-soft);\n    padding-top: 2px;\n  }\n\n  .detail-text {\n    font-size: 13.5px;\n    color: var(--ink);\n    line-height: 1.65;\n    font-weight: 300;\n  }\n\n  .detail-text--example {\n    font-style: italic;\n    color: var(--ink-soft);\n    padding: 10px 14px;\n    background: var(--paper);\n    border-left: 2px solid var(--forest-soft);\n    border-radius: 0 var(--r-sm) var(--r-sm) 0;\n  }\n\n  .detail-tags {\n    display: flex;\n    flex-wrap: wrap;\n    gap: 6px;\n  }\n\n  .detail-tag {\n    font-size: 11px;\n    padding: 3px 10px;\n    border-radius: var(--r-pill);\n    background: var(--paper);\n    color: var(--forest-deep);\n    border: 1px solid var(--forest-mist);\n    font-weight: 400;\n  }\n\n  /* ─── ADAPTATIONS TABLE ─── */\n  .adaptations {\n    margin-top: 56px;\n    padding-top: 40px;\n    border-top: 1px solid var(--forest-mist);\n  }\n\n  .adaptations h2 {\n    font-family: 'Montserrat', sans-serif;\n    font-size: 24px;\n    font-weight: 500;\n    color: var(--forest-ink);\n    margin-bottom: 6px;\n    letter-spacing: -0.01em;\n  }\n  .adaptations-sub {\n    font-size: 13.5px;\n    color: var(--ink-soft);\n    margin-bottom: 24px;\n    max-width: 580px;\n  }\n\n  .adaptations-table {\n    background: var(--paper-pure);\n    border: 1px solid var(--forest-mist);\n    border-radius: var(--r-md);\n    overflow: hidden;\n  }\n  .adapt-row {\n    display: grid;\n    grid-template-columns: 200px 1fr;\n    gap: 24px;\n    padding: 20px 22px;\n    border-bottom: 1px solid var(--forest-mist);\n  }\n  .adapt-row:last-child { border-bottom: none; }\n  .adapt-label {\n    font-size: 13px;\n    font-weight: 500;\n    color: var(--forest-deep);\n    letter-spacing: -0.005em;\n  }\n  .adapt-text {\n    font-size: 13px;\n    color: var(--ink-soft);\n    line-height: 1.7;\n  }\n\n  /* ═══════════════════════════════════════\n     SESSION BUILDER (right rail)\n     ═══════════════════════════════════════ */\n  .builder {\n    position: sticky;\n    top: 24px;\n    align-self: start;\n    background: var(--paper-pure);\n    border: 1px solid var(--forest-mist);\n    border-radius: var(--r-lg);\n    overflow: hidden;\n    box-shadow: var(--shadow-md);\n    max-height: calc(100vh - 48px);\n    display: flex;\n    flex-direction: column;\n  }\n\n  .builder-header {\n    padding: 20px 22px 18px;\n    background: var(--forest-ink);\n    color: white;\n  }\n  .builder-eyebrow {\n    font-size: 10px;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: var(--forest-soft);\n    font-weight: 500;\n    margin-bottom: 6px;\n  }\n  .builder-title {\n    font-family: 'Montserrat', sans-serif;\n    font-size: 20px;\n    font-weight: 500;\n    margin-bottom: 4px;\n    letter-spacing: -0.005em;\n  }\n  .builder-tagline {\n    font-size: 12px;\n    color: rgba(255,255,255,0.6);\n    line-height: 1.5;\n  }\n\n  .builder-stats {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 1px;\n    background: var(--forest-mist);\n    border-bottom: 1px solid var(--forest-mist);\n  }\n  .stat {\n    background: var(--paper-card);\n    padding: 14px 18px;\n  }\n  .stat-label {\n    font-size: 9.5px;\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    color: var(--ink-faint);\n    font-weight: 500;\n    margin-bottom: 4px;\n  }\n  .stat-value {\n    font-family: 'Montserrat', sans-serif;\n    font-size: 22px;\n    font-weight: 500;\n    color: var(--forest-ink);\n    font-variant-numeric: tabular-nums;\n    letter-spacing: -0.01em;\n  }\n  .stat-value .unit {\n    font-family: 'Open Sans', sans-serif;\n    font-size: 11px;\n    color: var(--ink-faint);\n    font-weight: 400;\n    margin-left: 2px;\n  }\n\n  /* Arc balance bar */\n  .arc-balance {\n    padding: 14px 22px 16px;\n    background: var(--paper-card);\n    border-bottom: 1px solid var(--forest-mist);\n  }\n  .arc-label {\n    font-size: 9.5px;\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    color: var(--ink-faint);\n    font-weight: 500;\n    margin-bottom: 8px;\n  }\n  .arc-bar {\n    display: flex;\n    height: 8px;\n    border-radius: 4px;\n    overflow: hidden;\n    background: var(--paper);\n    border: 1px solid var(--forest-mist);\n  }\n  .arc-segment {\n    height: 100%;\n    transition: flex 0.4s ease;\n    min-width: 0;\n  }\n  .arc-segment[data-group=\"1\"] { background: var(--forest-soft); }\n  .arc-segment[data-group=\"2\"] { background: var(--forest-mid); }\n  .arc-segment[data-group=\"3\"] { background: var(--forest-deep); }\n  .arc-segment[data-group=\"4\"] { background: var(--bark); }\n  .arc-segment[data-group=\"5\"] { background: var(--ember); }\n\n  .arc-legend {\n    display: flex;\n    flex-wrap: wrap;\n    gap: 4px 10px;\n    margin-top: 10px;\n    font-size: 10px;\n    color: var(--ink-faint);\n  }\n  .arc-legend-item { display: flex; align-items: center; gap: 5px; }\n  .arc-dot { width: 7px; height: 7px; border-radius: 50%; }\n\n  /* Builder list */\n  .builder-list {\n    flex: 1;\n    overflow-y: auto;\n    padding: 10px 14px 14px;\n  }\n\n  .builder-empty {\n    padding: 32px 16px;\n    text-align: center;\n    color: var(--ink-faint);\n    font-size: 12.5px;\n    line-height: 1.6;\n  }\n  .builder-empty-icon {\n    width: 36px; height: 36px;\n    margin: 0 auto 12px;\n    color: var(--forest-soft);\n    opacity: 0.6;\n  }\n\n  .builder-row {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    padding: 10px 12px;\n    margin-bottom: 6px;\n    background: var(--paper);\n    border: 1px solid var(--forest-mist);\n    border-radius: var(--r-sm);\n    transition: all 0.18s;\n    animation: slideIn 0.25s ease;\n  }\n  .builder-row:hover { border-color: var(--forest-soft); }\n  @keyframes slideIn {\n    from { opacity: 0; transform: translateX(8px); }\n    to { opacity: 1; transform: translateX(0); }\n  }\n\n  .builder-row-handle {\n    color: var(--ink-faint);\n    cursor: grab;\n    flex-shrink: 0;\n    line-height: 1;\n    font-size: 14px;\n    letter-spacing: -2px;\n  }\n  .builder-row-handle:active { cursor: grabbing; }\n\n  .builder-row-group {\n    width: 6px; height: 6px;\n    border-radius: 50%;\n    flex-shrink: 0;\n  }\n\n  .builder-row-name {\n    flex: 1;\n    font-size: 12.5px;\n    color: var(--forest-ink);\n    font-weight: 400;\n    line-height: 1.3;\n    min-width: 0;\n  }\n\n  .builder-row-dur {\n    font-size: 10.5px;\n    color: var(--ink-faint);\n    font-variant-numeric: tabular-nums;\n    flex-shrink: 0;\n  }\n\n  .builder-row-remove {\n    width: 18px; height: 18px;\n    border-radius: 50%;\n    background: transparent;\n    border: none;\n    color: var(--ink-faint);\n    cursor: pointer;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 14px;\n    line-height: 1;\n    transition: all 0.15s;\n    flex-shrink: 0;\n  }\n  .builder-row-remove:hover { background: var(--ember); color: white; }\n\n  .builder-actions {\n    padding: 14px 18px 18px;\n    border-top: 1px solid var(--forest-mist);\n    display: flex;\n    gap: 8px;\n    background: var(--paper-card);\n  }\n  .builder-btn {\n    flex: 1;\n    padding: 10px 14px;\n    border-radius: var(--r-sm);\n    border: 1px solid var(--forest-mist);\n    background: var(--paper-pure);\n    color: var(--forest-deep);\n    font-size: 12px;\n    font-weight: 500;\n    cursor: pointer;\n    font-family: inherit;\n    letter-spacing: 0.02em;\n    transition: all 0.18s;\n  }\n  .builder-btn:hover { border-color: var(--forest-mid); color: var(--forest-ink); }\n  .builder-btn.primary {\n    background: var(--forest-deep);\n    border-color: var(--forest-deep);\n    color: white;\n  }\n  .builder-btn.primary:hover { background: var(--forest-ink); border-color: var(--forest-ink); }\n  .builder-btn:disabled { opacity: 0.4; cursor: not-allowed; }\n\n  /* ─── RUN MODE ─── */\n  .run-mode {\n    display: none;\n    position: fixed; inset: 0;\n    z-index: 200;\n    background: var(--paper);\n    flex-direction: column;\n    animation: fadeIn 0.25s ease;\n  }\n  .run-mode.active { display: flex; }\n  .run-header {\n    display: flex; justify-content: space-between; align-items: center;\n    padding: 18px 32px;\n    border-bottom: 1px solid var(--forest-mist);\n    background: var(--paper-pure);\n  }\n  .run-step {\n    font-size: 11px; letter-spacing: 0.16em;\n    text-transform: uppercase; color: var(--ink-faint);\n    font-weight: 500;\n  }\n  .run-close {\n    background: none; border: none; cursor: pointer;\n    font-size: 24px; color: var(--ink-faint);\n    padding: 4px 12px; line-height: 1;\n  }\n  .run-close:hover { color: var(--ink); }\n  .run-body {\n    flex: 1; overflow-y: auto;\n    padding: 44px 32px;\n    max-width: 760px; margin: 0 auto; width: 100%;\n  }\n  .run-group-tag {\n    font-size: 11px; letter-spacing: 0.18em;\n    text-transform: uppercase; color: var(--forest-deep);\n    margin-bottom: 14px; font-weight: 600;\n  }\n  .run-name {\n    font-family: 'Playfair Display', Georgia, serif;\n    font-weight: 600; font-size: 36px;\n    color: var(--ink);\n    margin-bottom: 8px; line-height: 1.15;\n    letter-spacing: -0.01em;\n  }\n  .run-duration {\n    font-size: 13px; color: var(--ink-faint);\n    margin-bottom: 28px;\n  }\n  .run-section { margin-bottom: 24px; }\n  .run-label {\n    font-size: 10.5px; letter-spacing: 0.14em;\n    text-transform: uppercase; color: var(--forest-deep);\n    margin-bottom: 6px; font-weight: 600;\n  }\n  .run-text { font-size: 14.5px; line-height: 1.65; color: var(--ink); }\n  .run-intro {\n    font-style: italic;\n    font-size: 15px; line-height: 1.6;\n    color: var(--ink-soft);\n    padding: 14px 18px;\n    border-left: 3px solid var(--forest-deep);\n    background: var(--paper-card);\n    border-radius: 0 var(--r-sm) var(--r-sm) 0;\n  }\n  .run-footer {\n    display: flex; gap: 10px; align-items: center;\n    padding: 16px 32px;\n    border-top: 1px solid var(--forest-mist);\n    background: var(--paper-pure);\n  }\n  .run-footer .spacer { flex: 1; }\n  .run-btn {\n    padding: 10px 18px;\n    border: 1px solid var(--forest-mist);\n    background: var(--paper-pure); color: var(--ink);\n    border-radius: var(--r-sm);\n    font-family: inherit; font-weight: 500;\n    cursor: pointer; font-size: 13.5px;\n    transition: all 0.18s;\n  }\n  .run-btn:hover:not(:disabled) { border-color: var(--forest-deep); }\n  .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }\n  .run-btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }\n  .run-btn.primary:hover { background: var(--forest-deep); border-color: var(--forest-deep); }\n  .run-btn.timer { background: var(--ember); color: white; border-color: var(--ember); }\n\n  /* ─── TIMER MODAL ─── */\n  .timer-modal {\n    display: none;\n    position: fixed;\n    inset: 0;\n    background: rgba(20,48,42,0.45);\n    backdrop-filter: blur(8px);\n    z-index: 1000;\n    align-items: center;\n    justify-content: center;\n    animation: fadeIn 0.25s ease;\n  }\n  .timer-modal.active { display: flex; }\n  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }\n\n  .timer-modal-content {\n    background: var(--paper-pure);\n    border-radius: var(--r-lg);\n    padding: 36px 40px;\n    box-shadow: var(--shadow-lg);\n    max-width: 380px;\n    width: calc(100% - 32px);\n    text-align: center;\n    animation: slideUp 0.3s ease;\n  }\n  @keyframes slideUp {\n    from { opacity: 0; transform: translateY(16px) scale(0.98); }\n    to { opacity: 1; transform: translateY(0) scale(1); }\n  }\n\n  .timer-eyebrow {\n    font-size: 10px;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: var(--forest-soft);\n    font-weight: 500;\n    margin-bottom: 6px;\n  }\n  .timer-activity-name {\n    font-family: 'Montserrat', sans-serif;\n    font-size: 16px;\n    color: var(--forest-ink);\n    margin-bottom: 12px;\n    font-weight: 500;\n  }\n\n  .timer-ring-wrap {\n    position: relative;\n    width: 180px;\n    height: 180px;\n    margin: 12px auto 16px;\n  }\n  .timer-ring { transform: rotate(-90deg); }\n  .timer-ring circle { fill: none; stroke-width: 4; }\n  .timer-ring .track { stroke: var(--forest-mist); }\n  .timer-ring .progress {\n    stroke: var(--forest-deep);\n    stroke-linecap: round;\n    transition: stroke-dashoffset 0.95s linear;\n  }\n  .timer-display {\n    position: absolute;\n    inset: 0;\n    display: flex; align-items: center; justify-content: center;\n    font-family: 'Montserrat', sans-serif;\n    font-size: 44px;\n    color: var(--forest-ink);\n    font-variant-numeric: tabular-nums;\n    font-weight: 500;\n    letter-spacing: -0.02em;\n  }\n\n  .timer-controls {\n    display: flex;\n    gap: 8px;\n    justify-content: center;\n    margin-top: 12px;\n  }\n  .timer-btn {\n    padding: 10px 20px;\n    border-radius: var(--r-sm);\n    border: 1px solid var(--forest-mist);\n    background: var(--paper);\n    color: var(--forest-deep);\n    font-size: 12.5px;\n    font-weight: 500;\n    cursor: pointer;\n    font-family: inherit;\n    transition: all 0.18s;\n    letter-spacing: 0.02em;\n  }\n  .timer-btn:hover { background: var(--forest-deep); color: white; border-color: var(--forest-deep); }\n  .timer-btn.primary { background: var(--forest-deep); color: white; border-color: var(--forest-deep); }\n  .timer-btn.primary:hover { background: var(--forest-ink); border-color: var(--forest-ink); }\n\n  /* ─── TOAST ─── */\n  .toast {\n    position: fixed;\n    bottom: 24px;\n    left: 50%;\n    transform: translateX(-50%) translateY(80px);\n    background: var(--forest-ink);\n    color: white;\n    padding: 12px 20px;\n    border-radius: var(--r-pill);\n    font-size: 12.5px;\n    font-weight: 400;\n    box-shadow: var(--shadow-lg);\n    opacity: 0;\n    transition: all 0.3s ease;\n    z-index: 2000;\n    pointer-events: none;\n    letter-spacing: 0.02em;\n  }\n  .toast.show {\n    opacity: 1;\n    transform: translateX(-50%) translateY(0);\n  }\n\n  /* ─── RESPONSIVE ─── */\n  @media (max-width: 1080px) {\n    .layout {\n      grid-template-columns: 1fr;\n    }\n    .builder {\n      position: fixed;\n      bottom: 0; left: 0; right: 0;\n      top: auto;\n      max-height: 60vh;\n      border-radius: var(--r-lg) var(--r-lg) 0 0;\n      transform: translateY(calc(100% - 56px));\n      transition: transform 0.3s ease;\n      z-index: 50;\n    }\n    .builder.expanded { transform: translateY(0); }\n    .builder-header { cursor: pointer; }\n    body { padding-bottom: 80px; }\n  }\n\n  @media (max-width: 640px) {\n    body { padding: 32px 16px 80px; }\n    .section-header h1 { font-size: 28px; }\n    .pocket-group-title { font-size: 18px; }\n    .activity-trigger { padding: 14px; gap: 10px; }\n    .activity-glyph { width: 28px; height: 28px; }\n    .activity-detail { padding: 4px 16px 20px; }\n    .detail-grid { grid-template-columns: 1fr; gap: 4px 0; }\n    .detail-label { padding-top: 12px; }\n    .detail-grid > div:first-child { padding-top: 0; }\n    .adapt-row { grid-template-columns: 1fr; gap: 8px; padding: 16px 18px; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n\n\n<div class=\"layout\">\n\n  <main class=\"container\">\n\n    <!-- BREADCRUMB -->\n    <nav class=\"breadcrumb\">\n      <a href=\"#\">Practitioner<\u002Fa>\n      <span class=\"sep\">/<\u002Fspan>\n      <a href=\"#\">Programme guide<\u002Fa>\n      <span class=\"sep\">/<\u002Fspan>\n      <span>Pocketbook<\u002Fspan>\n    <\u002Fnav>\n\n    <!-- SECTION HEADER -->\n    <header class=\"section-header\">\n      <span class=\"badge\">Part Four<\u002Fspan>\n      <h1>Pocketbook of Activities<\u002Fh1>\n      <p class=\"section-sub\">Activities drawn directly from practitioner accounts across five countries, organised by therapeutic function rather than session number.<\u002Fp>\n    <\u002Fheader>\n\n    <!-- INTRO -->\n    <section class=\"prose\">\n      <h3>How to use this section<\u002Fh3>\n      <p>Activities are grouped under five themes that map onto the therapeutic arc: <strong>Getting There<\u002Fstrong>; <strong>Waking Up Your Senses<\u002Fstrong>; <strong>Discovering Yourself<\u002Fstrong>; <strong>Connecting with Others<\u002Fstrong>; and <strong>Coming Back to Yourself<\u002Fstrong>. Within each group, activities range from lower to higher demand. Select based on where the group is on a given day, not on where the session plan says they should be.<\u002Fp>\n      <p>The principle of <em>invitation rather than task<\u002Fem> applies throughout. No activity is mandatory, and a young person who watches rather than participates is participating.<\u002Fp>\n    <\u002Fsection>\n\n    <!-- GROUPS render here -->\n    <div id=\"groups\"><\u002Fdiv>\n\n    <!-- ADAPTATIONS -->\n    <section class=\"adaptations\">\n      <h2>Adapting activities for specific presentations<\u002Fh2>\n      <p class=\"adaptations-sub\">Suggested adjustments for the most common clinical pictures encountered in early sessions.<\u002Fp>\n      <div class=\"adaptations-table\" id=\"adaptations-table\"><\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fmain>\n\n  <!-- ─── SESSION BUILDER ─── -->\n  <aside class=\"builder\" id=\"builder\">\n\n    <header class=\"builder-header\" onclick=\"toggleBuilderMobile()\">\n      <div class=\"builder-eyebrow\">Practitioner tool<\u002Fdiv>\n      <div class=\"builder-title\">Session Builder<\u002Fdiv>\n      <div class=\"builder-tagline\">Compose a session by adding activities. Sequence reflects the therapeutic arc.<\u002Fdiv>\n    <\u002Fheader>\n\n    <div class=\"builder-stats\">\n      <div class=\"stat\">\n        <div class=\"stat-label\">Activities<\u002Fdiv>\n        <div class=\"stat-value\" id=\"stat-count\">0<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat\">\n        <div class=\"stat-label\">Total time<\u002Fdiv>\n        <div class=\"stat-value\"><span id=\"stat-time\">0<\u002Fspan><span class=\"unit\">min<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"arc-balance\">\n      <div class=\"arc-label\">Arc balance<\u002Fdiv>\n      <div class=\"arc-bar\" id=\"arc-bar\"><\u002Fdiv>\n      <div class=\"arc-legend\" id=\"arc-legend\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"builder-list\" id=\"builder-list\">\n      <div class=\"builder-empty\">\n        <svg class=\"builder-empty-icon\" viewBox=\"0 0 36 36\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\n          <path d=\"M6 8h24M6 14h24M6 20h16M6 26h12\"><\u002Fpath>\n          <circle cx=\"28\" cy=\"26\" r=\"4\"><\u002Fcircle>\n          <path d=\"M28 24v4M26 26h4\"><\u002Fpath>\n        <\u002Fsvg>\n        <div>No activities yet.<br>Tap <strong>+<\u002Fstrong> next to any activity to begin.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"builder-actions\">\n      <button class=\"builder-btn\" id=\"btn-clear\" onclick=\"clearSession()\" disabled=\"\">Clear<\u002Fbutton>\n      <button class=\"builder-btn primary\" id=\"btn-export\" onclick=\"startRunMode()\" disabled=\"\">Run mode →<\u002Fbutton>\n    <\u002Fdiv>\n\n  <\u002Faside>\n\n<\u002Fdiv>\n\n<!-- ─── TIMER MODAL ─── -->\n<div class=\"timer-modal\" id=\"timerModal\" onclick=\"if(event.target===this) closeTimer()\">\n  <div class=\"timer-modal-content\">\n    <div class=\"timer-eyebrow\">Sustained presence<\u002Fdiv>\n    <div class=\"timer-activity-name\" id=\"timerActivityName\">—<\u002Fdiv>\n    <div class=\"timer-ring-wrap\">\n      <svg class=\"timer-ring\" width=\"180\" height=\"180\" viewBox=\"0 0 180 180\">\n        <circle class=\"track\" cx=\"90\" cy=\"90\" r=\"82\"><\u002Fcircle>\n        <circle class=\"progress\" id=\"timerProgress\" cx=\"90\" cy=\"90\" r=\"82\" stroke-dasharray=\"515.22\" stroke-dashoffset=\"0\"><\u002Fcircle>\n      <\u002Fsvg>\n      <div class=\"timer-display\" id=\"timerDisplay\">00:00<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"timer-controls\">\n      <button class=\"timer-btn\" id=\"pauseBtn\" onclick=\"pauseTimer()\">Pause<\u002Fbutton>\n      <button class=\"timer-btn primary\" onclick=\"closeTimer()\">Close<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- TOAST -->\n<div class=\"toast\" id=\"toast\"><\u002Fdiv>\n\n<!-- RUN MODE -->\n<div class=\"run-mode\" id=\"runMode\" role=\"dialog\" aria-modal=\"true\">\n  <div class=\"run-header\">\n    <div class=\"run-step\" id=\"runStep\">1 / 1<\u002Fdiv>\n    <button class=\"run-close\" onclick=\"closeRunMode()\" aria-label=\"Close run mode\">×<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"run-body\">\n    <div class=\"run-group-tag\" id=\"runGroup\"><\u002Fdiv>\n    <h2 class=\"run-name\" id=\"runName\"><\u002Fh2>\n    <div class=\"run-duration\" id=\"runDuration\"><\u002Fdiv>\n    <div class=\"run-section\">\n      <div class=\"run-label\">Purpose<\u002Fdiv>\n      <div class=\"run-text\" id=\"runPurpose\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"run-section\">\n      <div class=\"run-label\">How to introduce<\u002Fdiv>\n      <div class=\"run-intro\" id=\"runIntro\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"run-section\">\n      <div class=\"run-label\">Materials<\u002Fdiv>\n      <div class=\"run-text\" id=\"runMaterials\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"run-section\">\n      <div class=\"run-label\">How to close<\u002Fdiv>\n      <div class=\"run-text\" id=\"runClose\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"run-footer\">\n    <button class=\"run-btn\" id=\"runPrev\" onclick=\"runPrev()\">← Previous<\u002Fbutton>\n    <button class=\"run-btn timer\" id=\"runTimerBtn\" onclick=\"runTimer()\">Start timer<\u002Fbutton>\n    <div class=\"spacer\"><\u002Fdiv>\n    <button class=\"run-btn primary\" id=\"runNext\" onclick=\"runNext()\">Next →<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- DATA + APP -->\n<script src=\"2ac7ee1c-4f25-4c9a-a0a5-a66390d4152d\"><\u002Fscript>\n<script src=\"33c3e886-95cf-49ce-a76c-0123e53fa60c\"><\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
